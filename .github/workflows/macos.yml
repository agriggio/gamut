name: macOS

# Builds a Gamut.app that carries its libraries, for a Mac without Homebrew,
# puts it on a disk image and attaches that to a release.
#
# Two things start it. A release, once the `Release` workflow has made it: a
# release made with the workflow token starts nothing itself, so this follows
# that workflow rather than the release. And a run by hand, which builds the
# tag it is given again, or with none builds the commit it is run from — the
# head of master — and publishes it as the `nightly` release, made anew each
# time.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to build for, as vX.Y.Z; empty for a nightly of this commit
        required: false

env:
  # The tag is the push's for a run that follows `Release`, the one given for
  # a run by hand, and `nightly` where there is none.
  TAG: ${{ inputs.tag || github.event.workflow_run.head_branch || 'nightly' }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # What to build: the tag's own source, or for a nightly the commit run from.
  REF: ${{ inputs.tag || github.event.workflow_run.head_branch || github.sha }}

jobs:
  dmg:
    name: Disk image on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        # The libraries inside are Homebrew's, built for the macOS they are
        # built on, so the image needs that macOS or a later one, and the
        # architecture it was made on.
        os: [macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Install the libraries it links
        run: brew install pkgconf libheif libraw little-cms2

      - name: Build
        run: cargo build --release --locked

      - name: Bundle it with its libraries
        run: bin/bundle --standalone

      - name: Run it as a Mac without Homebrew would
        # It starts, reads a file, and loads nothing from Homebrew's prefix:
        # `bin/bundle` has checked the names, and this checks the loader.
        run: |
          app=target/release/Gamut.app/Contents/MacOS/gamut
          printf 'not a picture' >"$RUNNER_TEMP/broken.png"
          # The loader's list and the program's own words both come on stderr.
          DYLD_PRINT_LIBRARIES=1 "$app" --version >"$RUNNER_TEMP/loaded" 2>&1
          DYLD_PRINT_LIBRARIES=1 "$app" "$RUNNER_TEMP/broken.png" >"$RUNNER_TEMP/read" 2>&1 || true
          grep -q "reading the header" "$RUNNER_TEMP/read" || {
            echo "it does not read a file" >&2
            cat "$RUNNER_TEMP/read" >&2
            exit 1
          }
          cat "$RUNNER_TEMP/read" >>"$RUNNER_TEMP/loaded"
          if grep -E '/opt/homebrew|/usr/local' "$RUNNER_TEMP/loaded"; then
            echo "it loaded a library from outside the bundle" >&2
            exit 1
          fi

      - name: Disk image
        run: bin/dmg

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.os }}
          path: target/release/*.dmg
          if-no-files-found: error

  publish:
    name: Attach the disk images to the release
    needs: dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          pattern: dmg-*
          merge-multiple: true

      - name: The nightly release is made anew
        # The one release that is not a version's: its tag moves to the commit
        # built, and the images of the last one go with the release they
        # were on. The tag is not a `v*`, so `Release` does not run for it.
        if: env.TAG == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --prerelease \
            --title "Nightly" \
            --notes "Built from $SHA. Not a release."

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dmgs/*.dmg --clobber
